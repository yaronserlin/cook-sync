services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cooksync_db}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 forces a real TCP connection (the default, no -h, uses the local
      # Unix socket instead). On a restart against an existing volume, MySQL briefly
      # runs a socket-only internal instance before its TCP listener is ready; without
      # -h this check passes against that internal instance and reports healthy a
      # moment before `server` can actually connect over the network.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: cook-sync-server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Always "root" here: MySQL's official image only provisions a root user from
      # MYSQL_ROOT_PASSWORD out of the box, matching this project's local-dev default
      # (see cook-sync-server/src/main/resources/application.properties).
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-cooksync_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      # Set by "./docker-up.sh --seed" (or pass SPRING_PROFILES_ACTIVE=seed yourself) to
      # activate DataSeeder, which wipes and repopulates the DB with the demo dataset.
      # Empty by default: normal startup runs no seeder.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
