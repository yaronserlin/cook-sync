services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cooksync_db}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-root}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: cook-sync-server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-cooksync_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
