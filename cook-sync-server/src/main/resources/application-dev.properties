# Local development overrides - active by default (see application.properties'
# spring.profiles.active=dev), or explicitly via SPRING_PROFILES_ACTIVE=dev.

# Verbose application logging, including redacted request/response bodies logged by
# RequestAndResponseLoggingFilter at DEBUG - fine for local dev, too noisy/PII-heavy for prod.
logging.level.com.cooksync_server=DEBUG

# Lets Hibernate auto-adjust the schema on top of Flyway's migrations, convenient while
# iterating on entities locally without hand-writing a migration for every change. Never do
# this in prod - see application-prod.properties.
spring.jpa.hibernate.ddl-auto=update

# Open by default for local tooling (Postman, a browser-based API client, etc.). The Android
# app itself ignores this entirely - CORS is a browser-only mechanism, not enforced by
# Retrofit/OkHttp. Override with CORS_ALLOWED_ORIGINS if needed.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Keeps locally-uploaded test images out of the production Cloudinary folder.
cloudinary.upload.base-folder=cooksync-dev
