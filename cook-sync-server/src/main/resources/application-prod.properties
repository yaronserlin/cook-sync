# Production Spring Boot Configuration Profile for CookSync Server

# Database Connection via Environment Variables
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP resilience for cloud/serverless MySQL-compatible databases (e.g. TiDB
# Cloud Serverless) that may need extra time to establish/warm up a connection
# on first use rather than failing app startup outright.
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.max-lifetime=280000

# JPA & Hibernate Production Hardening
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migrations
spring.flyway.enabled=true
# Prod DB already had tables (created pre-Flyway) with no history table, so the
# first migrating run baselines it rather than failing outright.
spring.flyway.baseline-on-migrate=true
# Baseline at 0 rather than Flyway's default of 1. The default records the
# existing schema as already at V1 and then skips every migration at or below
# that version -- which, with V1 being the only migration there was, left Flyway
# permanently unable to change this database. Baselining at 0 keeps V1 in play;
# replaying it is safe because every statement in it is CREATE TABLE IF NOT
# EXISTS. Note this only affects databases not yet baselined: one already
# stamped at version 1 keeps that stamp, which is why schema corrections belong
# in a new migration (see V2) instead of an edit to V1.
spring.flyway.baseline-version=0

# Actuator Health & Monitoring Endpoint Security
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# Keep mail out of the health aggregate. Actuator auto-registers a
# MailHealthIndicator whenever spring-boot-starter-mail is on the classpath, and
# it opens a real SMTP connection to Gmail on every single /actuator/health call.
# That makes the platform's health check depend on a third party: when outbound
# SMTP is blocked or slow, /actuator/health answers 503 -- after blocking for the
# full socket timeout -- even though the API itself is serving normally, and the
# platform then pulls the instance out of rotation. Whether Gmail is reachable is
# a request-path concern for the OTP endpoints, not a liveness signal for the API.
management.health.mail.enabled=false

# Production Logging Configuration
# Console format is inherited from logback-spring.xml (shared by every profile, dev and prod alike);
# only verbosity differs here.
logging.level.com.cooksync_server=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
spring.main.log-startup-info=false
spring.main.banner-mode=off

# JWT Security
jwt.secret=${JWT_SECRET}

# CORS allowed origins for the REST API, comma-separated. No wildcard fallback in production:
# CORS_ALLOWED_ORIGINS must be set explicitly to the real client origin(s).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Cloudinary Media Storage
# Root folder all uploads are namespaced under in production.
cloudinary.upload.base-folder=CookSyncApp
