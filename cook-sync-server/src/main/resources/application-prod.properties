# Production overrides - active when SPRING_PROFILES_ACTIVE includes "prod" (set this as an
# environment variable on the Render service; combine with "prodSeeder" - e.g.
# "prod,prodSeeder" - to also run ProductionSeeder's one-off seeding on that boot).

# Quieter logging: RequestAndResponseLoggingFilter's request/response body dump only fires at
# DEBUG, and that body includes user PII (names, emails, bios, addresses) beyond the
# password/token/secret fields it redacts - keep it off in prod.
logging.level.com.cooksync_server=INFO
logging.level.org.springframework=WARN

# Schema changes only ever happen through reviewed Flyway migrations in prod - never let
# Hibernate auto-alter the schema on top of them.
spring.jpa.hibernate.ddl-auto=validate

# Closed by default: there is no browser-based client (the Android app isn't subject to CORS
# at all), so this has nothing to protect until a web frontend exists. If one is added, set
# CORS_ALLOWED_ORIGINS to its exact origin(s) - never "*" once real user sessions are involved.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Keeps production user uploads in their own Cloudinary folder, separate from dev/test uploads.
cloudinary.upload.base-folder=cooksync-prod

# Render terminates TLS and proxies requests to this container, so without this, every request's
# remote address (as seen by RequestAndResponseLoggingFilter's client-IP logging and
# RateLimitFilter's per-IP throttling) would resolve to Render's edge, not the real client. This
# makes embedded Tomcat's RemoteIpValve parse X-Forwarded-For/-Proto and rewrite
# HttpServletRequest#getRemoteAddr()/getScheme() to the real values - safe here because Render's
# architecture means every request is guaranteed to reach this container through their proxy,
# never directly from the public internet.
server.forward-headers-strategy=native
