spring.config.import=optional:file:.env[.properties]

# Defaults to "dev" (application-dev.properties) so a plain `mvnw spring-boot:run`/IDE run
# needs no extra flags. Render (and any other real deployment) sets the SPRING_PROFILES_ACTIVE
# environment variable to "prod" (application-prod.properties), which - being an OS
# environment variable - takes precedence over this file and replaces "dev" entirely. To also
# run the one-off production seeder there, use "prod,prodSeeder" (see ProductionSeeder).
spring.profiles.active=dev

server.address=0.0.0.0
server.port=${PORT:8080}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cooksync_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto is profile-specific - see application-dev.properties /
# application-prod.properties.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true

# Exposes only /actuator/health over HTTP (Spring Boot's default is to expose nothing but
# health), for Docker's/Render's health checks - explicit here so it reads as a deliberate
# choice, not an oversight, since exposing more (env, beans, mappings, ...) would leak internal
# config to whoever can reach the endpoint. show-details=never keeps the response to a bare
# {"status": "UP"/"DOWN"} even though the DB connectivity check that backs it still runs -
# no internals about *why* it's down are exposed. Permitted unauthenticated in SecurityConfig,
# since the platform prober has no JWT to send.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# No insecure fallback: JWT_SECRET must be set in the environment (see .env), even for local dev.
jwt.secret=${JWT_SECRET}

# Refresh token validity in milliseconds (default: 604800000 = 7 days).
jwt.refreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS allowed origins for the REST API - profile-specific (see application-dev.properties /
# application-prod.properties). Irrelevant to the Android client (CORS is a browser-only
# mechanism); it only matters if a browser-based client is ever added.

# MAIL_USERNAME must be a full Gmail address; MAIL_PASSWORD must be a Google App Password
# (Google Account > Security > 2-Step Verification > App Passwords), not the account password.
# Both default to empty so the app can still start without them; EmailServiceImp detects the
# missing/invalid credentials at send time, logs a warning, and logs the email content (incl.
# the OTP/reset code) at debug level instead of sending.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CLOUDINARY_CLOUD_NAME/API_KEY/API_SECRET are read directly by CloudinaryConfig with an inline
# empty default (${CLOUDINARY_CLOUD_NAME:}, etc.) rather than being redeclared here - assigning
# them to a property of the *same name* here would make Spring resolve the placeholder against
# itself and fail at startup with "Circular placeholder reference". CloudinaryConfig/DataSeeder
# detect the resulting blank credentials and skip upload attempts, falling back to the original
# image URLs instead, so the app (and the "seed" data seeder) still start and run without a
# Cloudinary account configured.

# cloudinary.upload.base-folder is profile-specific - see application-dev.properties /
# application-prod.properties.

logging.level.org.springframework=INFO
# logging.level.com.cooksync_server is profile-specific - see application-dev.properties /
# application-prod.properties.
spring.main.log-startup-info=false
spring.main.banner-mode=off



