spring.config.import=optional:file:.env[.properties]

# No default active profile here on purpose: every setting below is already the safe,
# production-appropriate value, so an environment that never sets SPRING_PROFILES_ACTIVE (a
# misconfigured Render service, a future deploy target, etc.) fails safe rather than silently
# getting dev's noisier/more permissive behavior. application-dev.properties (only loaded when
# the "dev" profile is explicitly active - see its own comment for how) overrides these for
# local convenience. application-prod.properties re-states the same values explicitly, as
# documentation of what "prod" means, plus the one setting (server.forward-headers-strategy)
# that's meaningless outside a real reverse proxy.

server.address=0.0.0.0
server.port=${PORT:8080}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cooksync_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Schema changes only ever happen through reviewed Flyway migrations by default - never let
# Hibernate auto-alter the schema. application-dev.properties relaxes this to "update" for
# local iteration.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true

# Exposes only /actuator/health over HTTP (Spring Boot's default is to expose nothing but
# health), for Docker's/Render's health checks - explicit here so it reads as a deliberate
# choice, not an oversight, since exposing more (env, beans, mappings, ...) would leak internal
# config to whoever can reach the endpoint. show-details=never keeps the response to a bare
# {"status": "UP"/"DOWN"} even though the DB connectivity check that backs it still runs -
# no internals about *why* it's down are exposed. Permitted unauthenticated in SecurityConfig,
# since the platform prober has no JWT to send.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# No insecure fallback: JWT_SECRET must be set in the environment (see .env), even for local dev.
jwt.secret=${JWT_SECRET}

# Refresh token validity in milliseconds (default: 604800000 = 7 days).
jwt.refreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Closed by default: there is no browser-based client (the Android app isn't subject to CORS
# at all - it's a browser-only mechanism, not enforced by Retrofit/OkHttp), so this has nothing
# to protect until a web frontend exists. If one is added, set CORS_ALLOWED_ORIGINS to its
# exact origin(s) - never "*" once real user sessions are involved. application-dev.properties
# opens this up for local browser-based tooling (Postman, etc.).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# GOOGLE_OAUTH_CLIENT_ID/GOOGLE_OAUTH_CLIENT_SECRET/GOOGLE_OAUTH_REFRESH_TOKEN are read directly
# by EmailServiceImp (same reasoning as CLOUDINARY_* just below: a same-named property here would
# self-reference and fail to start with "Circular placeholder reference"). Gmail SMTP (587/465)
# is unreachable from Render's network - confirmed by a direct connectivity probe from the
# deployed service - so mail is sent via the Gmail API (OAuth2, HTTPS) instead of
# spring-boot-starter-mail/JavaMailSender, using a refresh token pre-authorized for the sending
# account (see cook-sync-server/README.md's Configuration table for how to obtain one).

# CLOUDINARY_CLOUD_NAME/API_KEY/API_SECRET are read directly by CloudinaryConfig with an inline
# empty default (${CLOUDINARY_CLOUD_NAME:}, etc.) rather than being redeclared here - assigning
# them to a property of the *same name* here would make Spring resolve the placeholder against
# itself and fail at startup with "Circular placeholder reference". CloudinaryConfig/DataSeeder
# detect the resulting blank credentials and skip upload attempts, falling back to the original
# image URLs instead, so the app (and the "seed" data seeder) still start and run without a
# Cloudinary account configured.

# Keeps production user uploads in their own Cloudinary folder, separate from dev/test uploads.
# application-dev.properties points this at cooksync-dev instead.
cloudinary.upload.base-folder=cooksync-prod

# Quiet by default: RequestAndResponseLoggingFilter's request/response body dump only fires at
# DEBUG, and that body includes user PII (names, emails, bios, addresses) beyond the
# password/token/secret fields it redacts - keep it off unless "dev" is explicitly active.
logging.level.com.cooksync_server=INFO
logging.level.org.springframework=INFO
spring.main.log-startup-info=false
spring.main.banner-mode=off



