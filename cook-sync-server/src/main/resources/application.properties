# Load environment variables from .env if present
spring.config.import=optional:file:.env[.properties]

# Server Listening Address & Port
server.address=0.0.0.0
server.port=${PORT:8080}

# Spring DataSource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cooksync_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migrations
spring.flyway.enabled=true
# spring.flyway.enabled=true
# spring.flyway.baseline-on-migrate=true
# spring.flyway.locations=classpath:db/migration
# spring.flyway.postgresql.transactional-lock=false
# spring.flyway.mysql.transactional-lock=false

# Custom Security & Auth Properties
# No insecure fallback: JWT_SECRET must be set in the environment (see .env), even for local dev.
jwt.secret=${JWT_SECRET}

# CORS allowed origins for the REST API, comma-separated (or '*' for open access, the default).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Outgoing Mail (Gmail SMTP) — used to deliver registration OTP emails.
# MAIL_USERNAME must be a full Gmail address; MAIL_PASSWORD must be a Google App Password
# (Google Account > Security > 2-Step Verification > App Passwords), not the account password.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cloudinary Media Storage
# Root folder all uploads are namespaced under.
cloudinary.upload.base-folder=cooksync-dev

# Logging Configuration
# Console format, coloring, and column alignment are defined in logback-spring.xml.
logging.level.com.cooksync_server=DEBUG
logging.level.org.springframework=INFO
spring.main.log-startup-info=false
spring.main.banner-mode=off



