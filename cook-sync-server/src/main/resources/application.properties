spring.config.import=optional:file:.env[.properties]

server.address=0.0.0.0
server.port=${PORT:8080}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cooksync_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true

# No insecure fallback: JWT_SECRET must be set in the environment (see .env), even for local dev.
jwt.secret=${JWT_SECRET}

# Refresh token validity in milliseconds (default: 604800000 = 7 days).
jwt.refreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS allowed origins for the REST API, comma-separated (or '*' for open access, the default).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# MAIL_USERNAME must be a full Gmail address; MAIL_PASSWORD must be a Google App Password
# (Google Account > Security > 2-Step Verification > App Passwords), not the account password.
# Both default to empty so the app can still start without them; EmailServiceImp detects the
# missing/invalid credentials at send time, logs a warning, and logs the email content (incl.
# the OTP/reset code) at debug level instead of sending.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CLOUDINARY_CLOUD_NAME/API_KEY/API_SECRET are read directly by CloudinaryConfig with an inline
# empty default (${CLOUDINARY_CLOUD_NAME:}, etc.) rather than being redeclared here - assigning
# them to a property of the *same name* here would make Spring resolve the placeholder against
# itself and fail at startup with "Circular placeholder reference". CloudinaryConfig/DataSeeder
# detect the resulting blank credentials and skip upload attempts, falling back to the original
# image URLs instead, so the app (and the "seed" data seeder) still start and run without a
# Cloudinary account configured.

cloudinary.upload.base-folder=cooksync-dev

logging.level.com.cooksync_server=DEBUG
logging.level.org.springframework=INFO
spring.main.log-startup-info=false
spring.main.banner-mode=off



